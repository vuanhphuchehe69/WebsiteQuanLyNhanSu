{% extends 'base.html' %}
{% block body %}
    <div class="ph">
        <div>
            <h1>
                {{ icon('user') }}
                Cập nhật thông tin cá nhân
            </h1>
            <p>
                Thay đổi số điện thoại, email, địa chỉ liên hệ, ngày sinh, trình độ học vấn và chuyên môn của bạn.
            </p>
        </div>
    </div>
    <div class="card fm">
        <form method="post" enctype="multipart/form-data">
            <input type="hidden" name="_csrf" value="{{ csrf }}">
            
            <div style="display:flex;align-items:center;gap:18px;margin-bottom:24px;padding:16px;background:#f8fafc;border-radius:12px;border:1px solid #e2e8f0">
                {% if emp.HinhAnh %}
                    <img src="{{ emp.HinhAnh if emp.HinhAnh.startswith(('http://','https://','/static/')) else url_for('static', filename='uploads/avatars/' ~ emp.HinhAnh) }}" alt="Avatar" style="width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid #cbd5e1">
                {% else %}
                    <span class="av lg" style="width:64px;height:64px;font-size:24px;margin:0">{{ emp.HoTen|ini }}</span>
                {% endif %}
                <div style="flex:1">
                    <label style="font-weight:600;font-size:13.5px;color:#334155;margin-bottom:4px;display:block">Ảnh đại diện</label>
                    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
                        <input type="file" name="HinhAnh_file" accept="image/*" style="font-size:12px">
                        <input type="text" name="HinhAnh" value="{{ emp.HinhAnh or '' }}" placeholder="Hoặc dán URL ảnh trực tuyến" style="font-size:12px;max-width:280px">
                    </div>
                </div>
            </div>

            <div class="fg">
                <div>
                    <label for="f_HoTen">Họ và tên</label>
                    <input id="f_HoTen" value="{{ emp.HoTen }}" readonly style="background:#f1f5f9;cursor:not-allowed">
                </div>
                <div>
                    <label for="f_MaNV">Mã nhân viên</label>
                    <input id="f_MaNV" value="{{ emp.MaNV }}" readonly style="background:#f1f5f9;cursor:not-allowed">
                </div>
                <div>
                    <label for="f_SDT">Số điện thoại</label>
                    <input id="f_SDT" name="SDT" type="tel" value="{{ emp.SDT or '' }}" placeholder="0901234567">
                </div>
                <div>
                    <label for="f_Email">Địa chỉ Email</label>
                    <input id="f_Email" name="Email" type="email" value="{{ emp.Email or '' }}" placeholder="nhanvien@congty.com">
                </div>
                <div>
                    <label for="f_NgaySinh">Ngày sinh</label>
                    <input id="f_NgaySinh" name="NgaySinh" type="date" value="{{ emp.NgaySinh or '' }}">
                </div>
                <div>
                    <label for="f_GioiTinh">Giới tính</label>
                    <select id="f_GioiTinh" name="GioiTinh">
                        <option value="">Chọn giới tính...</option>
                        <option value="Nam" {{ 'selected' if emp.GioiTinh == 'Nam' }}>Nam</option>
                        <option value="Nữ" {{ 'selected' if emp.GioiTinh == 'Nữ' }}>Nữ</option>
                    </select>
                </div>
                <div>
                    <label for="f_TrinhDo">Trình độ học vấn</label>
                    <select id="f_TrinhDo" name="TrinhDo">
                        <option value="">Chọn trình độ...</option>
                        <option value="Đại học" {{ 'selected' if emp.TrinhDo == 'Đại học' }}>Đại học</option>
                        <option value="Thạc sĩ" {{ 'selected' if emp.TrinhDo == 'Thạc sĩ' }}>Thạc sĩ</option>
                        <option value="Tiến sĩ" {{ 'selected' if emp.TrinhDo == 'Tiến sĩ' }}>Tiến sĩ</option>
                        <option value="Cao đẳng" {{ 'selected' if emp.TrinhDo == 'Cao đẳng' }}>Cao đẳng</option>
                        <option value="Trung cấp" {{ 'selected' if emp.TrinhDo == 'Trung cấp' }}>Trung cấp</option>
                    </select>
                </div>
                <div>
                    <label for="f_ChuyenMon">Chuyên môn đào tạo</label>
                    <input id="f_ChuyenMon" name="ChuyenMon" type="text" value="{{ emp.ChuyenMon or '' }}" placeholder="Ví dụ: Công nghệ thông tin, Quản trị nhân sự...">
                </div>
                <div class="full">
                    <label for="f_DiaChi">Địa chỉ cư trú</label>
                    <input id="f_DiaChi" name="DiaChi" type="text" value="{{ emp.DiaChi or '' }}" placeholder="Số nhà, tên đường, phường/xã, quận/huyện...">
                </div>
            </div>
            <p style="margin:26px 0 0;display:flex;gap:12px;align-items:center">
                <button class="btn">
                    {{ icon('check') }}
                    Lưu thông tin
                </button>
                <a class="btn g" href="{{ url_for('main.me') }}">
                    {{ icon('x') }}
                    Hủy bỏ
                </a>
            </p>
        </form>
    </div>
{% endblock %}
