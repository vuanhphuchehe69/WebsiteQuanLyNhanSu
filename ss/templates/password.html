{% extends 'base.html' %}
{% block body %}
    <div class="ph">
        <div>
            <h1>
                Đổi mật khẩu
            </h1>
            <p>
                Mật khẩu mới cần từ 6 ký tự.
            </p>
        </div>
    </div>
    <div class="card fm">
        <form method="post">
            <input type="hidden" name="_csrf" value="{{csrf}}">
            <div class="fg">
                <div class="full">
                    <label>
                        Mật khẩu hiện tại
                    </label>
                    <input type="password" name="old" required>
                </div>
                <div>
                    <label>
                        Mật khẩu mới
                    </label>
                    <input type="password" name="new" required minlength="6">
                </div>
                <div>
                    <label>
                        Xác nhận mật khẩu mới
                    </label>
                    <input type="password" name="cf" required>
                </div>
            </div>
            <p style="margin:18px 0 0">
                <button class="btn">
                    Lưu mật khẩu
                </button>
            </p>
        </form>
    </div>
{% endblock %}
